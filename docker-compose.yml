services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lakebase-support-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_PROVIDER: local
      DB_SCHEMA: support_board
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: support_board
      PGUSER: support_app
      PGPASSWORD: support_app_dev
      PGSSLMODE: disable
      LOCAL_DEV_USER: developer@example.com
      API_PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: lakebase-support-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: support_board
      POSTGRES_USER: support_app
      POSTGRES_PASSWORD: support_app_dev
    ports:
      - "5434:5432"
    volumes:
      - support_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support_app -d support_board"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  support_postgres_data:
